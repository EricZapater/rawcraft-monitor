name: CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend & Agent Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Instal·lar dependències
        working-directory: ./backend
        run: go mod download

      - name: Executar tests
        working-directory: ./backend
        run: go test -v ./...

      - name: Compilar binari API (Punt Central)
        working-directory: ./backend
        run: go build -v ./cmd/api

      - name: Compilar binari Agent recol·lector (fora de Docker)
        working-directory: ./backend
        run: CGO_ENABLED=0 go build -v ./cmd/agent

  frontend-test:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codi
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instal·lar dependències
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Compilar Frontend (TypeScript & Vite)
        working-directory: ./frontend
        run: pnpm run build
